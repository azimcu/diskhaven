# Development instance on homenas. Fully isolated: own project name, own network, only the
# dummy-data folder is mounted. Remove everything with:  dev/remove-dev.sh
name: homevault-dev
services:
  homevault:
    build: ..
    image: homevault:dev
    container_name: homevault-dev
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8095:8080"
    environment:
      TZ: Europe/Istanbul
      HomeVault__AgentSocket: /run/homevault/diskd.sock
      HomeVault__DisksPath: /disks
    volumes:
      - /mnt/immich/homevault-dev/data:/data
      - /mnt/immich/homevault-dev/config:/config
      # disk agent socket (dev agent: virtual disks only) and the folder it mounts disks under
      - /run/homevault-dev:/run/homevault
      - type: bind
        source: /srv/homevault-dev/disks
        target: /disks
        bind:
          propagation: rslave
    mem_limit: 768m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
