# Development instance on homenas. Fully isolated: own project name, own network, only the
# dummy-data folder is mounted. Remove everything with:  dev/remove-dev.sh
name: diskhaven-dev
services:
  diskhaven:
    build: ..
    image: diskhaven:dev
    container_name: diskhaven-dev
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8095:8080"
    environment:
      TZ: Europe/Istanbul
      DiskHaven__AgentSocket: /run/diskhaven/diskd.sock
      DiskHaven__DisksPath: /disks
    volumes:
      - /mnt/immich/diskhaven-dev/data:/data
      - /mnt/immich/diskhaven-dev/config:/config
      # disk agent socket (dev agent: virtual disks only) and the folder it mounts disks under
      - /run/diskhaven-dev:/run/diskhaven
      - type: bind
        source: /srv/diskhaven-dev/disks
        target: /disks
        bind:
          propagation: rslave
    mem_limit: 768m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
