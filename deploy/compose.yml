# Production instance. Created and updated by deploy/install.sh (values come from deploy/.env).
name: diskhaven
services:
  diskhaven:
    build: ..
    image: diskhaven:latest
    container_name: diskhaven
    labels: {icon: "https://raw.githubusercontent.com/azimcu/diskhaven/main/web/public/icon.svg"}   # CasaOS icon
    user: "${DH_UID}:${DH_GID}"
    restart: unless-stopped
    ports:
      - "${DH_PORT:-8095}:8080"
    environment:
      TZ: Europe/Istanbul
      # OpenTelemetry (boş = kapalı). Sunucuda gözlem yığını: ~/projeler/gozlem
      DiskHaven__Telemetry__Metrics: ${DH_OTLP_METRICS:-}
      DiskHaven__Telemetry__Traces: ${DH_OTLP_TRACES:-}
      DiskHaven__Telemetry__ServiceName: diskhaven
      DiskHaven__AgentSocket: /run/diskhaven/diskd.sock
      DiskHaven__DisksPath: /disks
    volumes:
      - ${DH_DATA}:/data
      - ${DH_CONFIG}:/config
      - /run/diskhaven:/run/diskhaven
      - type: bind
        source: /srv/diskhaven/disks
        target: /disks
        bind:
          propagation: rslave
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

# CasaOS app tile metadata (ignored by docker compose)
x-casaos:
  architectures: [amd64]
  author: Azim Çağrı Ünal
  category: Utilities
  main: diskhaven
  port_map: "8095"
  scheme: http
  index: /
  icon: https://raw.githubusercontent.com/azimcu/diskhaven/main/web/public/icon.svg
  title:
    custom: DiskHaven
    en_US: DiskHaven
  tagline:
    en_US: Files and disks
  description:
    en_US: Files and disks
