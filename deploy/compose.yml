# Production instance. Created and updated by deploy/install.sh (values come from deploy/.env).
name: diskhaven
services:
  diskhaven:
    build: ..
    image: diskhaven:latest
    container_name: diskhaven
    labels: {icon: "http://192.168.1.249:8095/icon.svg"}   # CasaOS simgesi
    user: "${DH_UID}:${DH_GID}"
    restart: unless-stopped
    ports:
      - "${DH_PORT:-8095}:8080"
    environment:
      TZ: Europe/Istanbul
      # OpenTelemetry (boş = kapalı). Sunucuda gözlem yığını: ~/projeler/gozlem
      DiskHaven__Telemetry__Metrics: ${DH_OTLP_METRICS:-}
      DiskHaven__Telemetry__Traces: ${DH_OTLP_TRACES:-}
      DiskHaven__Telemetry__ServiceName: diskhaven
      DiskHaven__AgentSocket: /run/diskhaven/diskd.sock
      DiskHaven__DisksPath: /disks
    volumes:
      - ${DH_DATA}:/data
      - ${DH_CONFIG}:/config
      - /run/diskhaven:/run/diskhaven
      - type: bind
        source: /srv/diskhaven/disks
        target: /disks
        bind:
          propagation: rslave
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
